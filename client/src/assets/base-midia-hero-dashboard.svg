<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title">
  <title id="title">Painel de controle de performance</title>
  <style>
    @keyframes drawLine {
      from { stroke-dashoffset: 1000; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes fadeFill {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes popDot {
      0% { transform: scale(0); opacity: 0; }
      70% { transform: scale(1.5); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .graph-line {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: drawLine 2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }
    .graph-fill {
      opacity: 0;
      animation: fadeFill 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) 0.5s forwards;
    }
    .graph-dot {
      transform: scale(0);
      transform-origin: center;
      animation: popDot 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    .graph-dot:nth-child(1) { animation-delay: 0.1s; transform-origin: 34px 322px; }
    .graph-dot:nth-child(2) { animation-delay: 0.3s; transform-origin: 188px 284px; }
    .graph-dot:nth-child(3) { animation-delay: 0.5s; transform-origin: 320px 250px; }
    .graph-dot:nth-child(4) { animation-delay: 0.7s; transform-origin: 455px 218px; }
    .graph-dot:nth-child(5) { animation-delay: 0.9s; transform-origin: 598px 196px; }
    .graph-dot:nth-child(6) { animation-delay: 1.1s; transform-origin: 748px 174px; }
    .graph-dot:nth-child(7) { animation-delay: 1.3s; transform-origin: 866px 120px; }
    
    @keyframes pulseIndicator {
      0% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.1); }
      100% { opacity: 0.4; transform: scale(0.9); }
    }
    .indicator-dot {
      transform-origin: 850px 451px;
      animation: pulseIndicator 2s ease-in-out infinite;
    }
  </style>
  <rect width="900" height="520" rx="18" fill="#141414" stroke="#806060"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="34" y="42" fill="#38FF14" font-size="12" letter-spacing="2">PAINEL DE CONTROLE / LIVE</text>
    <text x="760" y="42" fill="#806060" font-size="11">ÚLTIMOS 90 DIAS</text>
    <line x1="34" y1="64" x2="866" y2="64" stroke="#342828"/>
    <text x="35" y="101" fill="#806060" font-size="11">ÍNDICE DE CLAREZA</text>
    <text x="35" y="140" fill="#F0F0F0" font-size="36" font-weight="700">82.4%</text>
    <text x="188" y="101" fill="#806060" font-size="11">LEADS QUALIFICADOS</text>
    <text x="188" y="140" fill="#F0F0F0" font-size="36" font-weight="700">+38.6%</text>
    <text x="380" y="101" fill="#806060" font-size="11">CUSTO POR LEAD</text>
    <text x="380" y="140" fill="#F0F0F0" font-size="36" font-weight="700">−21.4%</text>
    <text x="650" y="101" fill="#806060" font-size="11">STATUS</text>
    <text x="650" y="140" fill="#38FF14" font-size="16" font-weight="700">OTIMIZADO</text>
    <line x1="34" y1="177" x2="866" y2="177" stroke="#342828"/>
    <g stroke="#342828" stroke-dasharray="4 7">
      <line x1="34" y1="230" x2="866" y2="230"/>
      <line x1="34" y1="285" x2="866" y2="285"/>
      <line x1="34" y1="340" x2="866" y2="340"/>
    </g>
    <path class="graph-fill" d="M34 322 C105 310 132 315 188 284 S270 299 320 250 S390 272 455 218 S535 250 598 196 S690 231 748 174 S823 185 866 120 L866 340 L34 340 Z" fill="#38FF14" fill-opacity=".1"/>
    <path class="graph-line" d="M34 322 C105 310 132 315 188 284 S270 299 320 250 S390 272 455 218 S535 250 598 196 S690 231 748 174 S823 185 866 120" fill="none" stroke="#38FF14" stroke-width="5" stroke-linecap="round"/>
    <g fill="#38FF14">
      <circle class="graph-dot" cx="34" cy="322" r="5"/>
      <circle class="graph-dot" cx="188" cy="284" r="5"/>
      <circle class="graph-dot" cx="320" cy="250" r="5"/>
      <circle class="graph-dot" cx="455" cy="218" r="5"/>
      <circle class="graph-dot" cx="598" cy="196" r="5"/>
      <circle class="graph-dot" cx="748" cy="174" r="5"/>
      <circle class="graph-dot" cx="866" cy="120" r="5"/>
    </g>
    <text x="34" y="382" fill="#806060" font-size="10">S</text>
    <text x="160" y="382" fill="#806060" font-size="10">T</text>
    <text x="286" y="382" fill="#806060" font-size="10">Q</text>
    <text x="412" y="382" fill="#806060" font-size="10">Q</text>
    <text x="538" y="382" fill="#806060" font-size="10">S</text>
    <text x="664" y="382" fill="#806060" font-size="10">S</text>
    <text x="860" y="382" fill="#806060" font-size="10">D</text>
    <rect x="34" y="420" width="832" height="1" fill="#342828"/>
    <text x="34" y="455" fill="#806060" font-size="11">PRÓXIMO GARGALO</text>
    <text x="34" y="482" fill="#F0F0F0" font-size="17" font-weight="700">CONVERSÃO</text>
    <text x="680" y="455" fill="#806060" font-size="11">DADOS EM ANÁLISE</text>
    <circle class="indicator-dot" cx="850" cy="451" r="5" fill="#38FF14"/>
  </g>
</svg>
